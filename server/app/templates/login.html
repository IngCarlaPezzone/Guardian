<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ admin_title }}</title>
  <link rel="icon" type="image/png" href="/admin/static/guardian.png?v={{ admin_icon_version }}">
  <link rel="stylesheet" href="/admin/static/admin.css?v={{ admin_css_version }}">
</head>
<body class="login">
  <main class="login-panel">
    <h1 class="admin-brand"><img src="/admin/static/guardian.png" alt="" title="{{ admin_title }}"> {{ admin_title }}</h1>
    <form class="login-form" method="post" action="/admin/login">
      <label>Usuario<input name="username" autocomplete="username" required></label>
      <label>Contrasena<input name="password" type="password" autocomplete="current-password" required></label>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
