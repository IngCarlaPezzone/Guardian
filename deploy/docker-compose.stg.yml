# STG is intentionally a separate Compose project and never references PROD services or volumes.
services:
  guardian-stg-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - guardian_stg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  guardian-stg-app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - ../.env.stg
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RELEASES_DIR: /data/guardian/releases
      GUARDIAN_ENVIRONMENT: STG
    ports:
      - "8081:8080"
    volumes:
      - ../releases-stg:/data/guardian/releases
    depends_on:
      guardian-stg-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  guardian_stg_postgres_data:
